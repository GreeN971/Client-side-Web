<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Flow - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <!-- Login Section -->
            <section class="auth-form-section">
                <div class="auth-form-wrapper">
                    <!-- Logo & Header -->
                    <div class="logo-container">
                        <div class="logo">EF</div>
                        <h1 class="brand-name">Emotional Flow</h1>
                    </div>

                    <!-- Welcome Text -->
                    <div class="welcome-text">
                        <h2 class="welcome-title">Welcome!</h2>
                        <p class="welcome-subtitle">Ready to track your mood today?</p>
                    </div>

                    <!-- Form -->
                    <form id="loginForm" class="auth-form" novalidate>
                        <!-- Email Input -->
                        <div class="form-group">
                            <label for="email-input" class="form-label">Email address</label>
                            <div class="input-wrapper">
                                <input
                                    id="email-input"
                                    name="email"
                                    placeholder="your@mail.com"
                                    type="text"
                                    autocomplete="email"
                                    required
                                    class="form-input"
                                />
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="form-group">
                            <label for="password-input" class="form-label">Password</label>
                            <div class="input-wrapper input-with-icon">
                                <input
                                    id="password-input"
                                    name="password"
                                    placeholder="your_password"
                                    type="password"
                                    autocomplete="current-password"
                                    required
                                    class="form-input"
                                />
                                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary btn-full">Login</button>

                            <div class="form-links">
                                <a href="forgot-password.html" class="link-primary">Forgot password?</a>
                                <p class="form-link-text">
                                    Don't have an account?
                                    <a href="signup.html" class="link-primary">Sign up</a>
                                </p>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Illustration Section -->
            <aside class="illustration-section">
                <div class="illustration-placeholder">
                    <img src="images/listening-to-feedback.png" alt="Track Your Emotions" class="illustration-image">
                </div>
            </aside>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
