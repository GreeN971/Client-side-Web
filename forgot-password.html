<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Flow - Forgot Password</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <!-- Form Section -->
            <section class="auth-form-section">
                <div class="auth-form-wrapper">
                    <!-- Icon & Header -->
                    <div class="forgot-header">
                        <div class="forgot-icon">
                            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="#3655ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 8V16" stroke="#3655ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8 12H16" stroke="#3655ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h1 class="welcome-title">Forgot your password?</h1>
                    </div>

                    <!-- Form -->
                    <form id="forgotPasswordForm" class="auth-form" novalidate>
                        <!-- Pet Name Input -->
                        <div class="form-group">
                            <label for="pet-name" class="form-label">Enter your pet's name</label>
                            <div class="input-wrapper">
                                <input
                                    id="pet-name"
                                    name="pet-name"
                                    placeholder="Its name is..."
                                    type="text"
                                    autocomplete="off"
                                    required
                                    class="form-input"
                                />
                            </div>
                        </div>

                        <!-- New Password Input -->
                        <div class="form-group">
                            <label for="new-password" class="form-label">New Password</label>
                            <div class="input-wrapper input-with-icon">
                                <input
                                    id="new-password"
                                    name="new-password"
                                    placeholder="Enter new password"
                                    type="password"
                                    autocomplete="new-password"
                                    required
                                    class="form-input"
                                />
                                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm New Password Input -->
                        <div class="form-group">
                            <label for="confirm-new-password" class="form-label">Confirm New Password</label>
                            <div class="input-wrapper input-with-icon">
                                <input
                                    id="confirm-new-password"
                                    name="confirm-new-password"
                                    placeholder="Repeat new password"
                                    type="password"
                                    autocomplete="new-password"
                                    required
                                    class="form-input"
                                />
                                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary btn-full">Submit</button>
                            
                            <div class="form-links centered">
                                <a href="index.html" class="link-primary">Back to Login</a>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Illustration Section -->
            <aside class="illustration-section">
                <div class="illustration-placeholder">
                    <img src="images/illustration.png" alt="Track Your Emotions" class="illustration-image">
                </div>
            </aside>
        </div>
    </main>

    <script src="js/forgot-password.js"></script>
</body>
</html>
